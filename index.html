<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ローリングボール</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background-color: #87CEEB; /* 空の色 */
        }
        #gameCanvas {
            display: block;
        }
        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        #scoreBoard {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        #message {
            color: white;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
            margin-bottom: 20px;
        }
        button {
            pointer-events: auto;
            padding: 15px 30px;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            background-color: #ff4757;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
    <!-- Three.jsをCDNから読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="scoreBoard">スコア: <span id="score">0</span></div>
    
    <div id="uiLayer">
        <div id="message">ローリングボール</div>
        <button id="startButton">スタート</button>
    </div>

    <script>
        // 基本設定
        let scene, camera, renderer;
        let ball, ground;
        let obstacles = [];
        let isPlaying = false;
        let score = 0;
        let speed = 0.4;
        let ballSpeedX = 0;
        
        const GAME_WIDTH = 10; // 道の幅

        // UI要素
        const uiLayer = document.getElementById('uiLayer');
        const messageEl = document.getElementById('message');
        const startButton = document.getElementById('startButton');
        const scoreEl = document.getElementById('score');

        // 初期化処理
        function init() {
            // シーンの作成
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x87CEEB, 10, 50); // 奥行きに霧をかけて空と馴染ませる

            // カメラの作成
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 4, 7); // ボールの後ろ斜め上に配置
            camera.lookAt(0, 0, -10);

            // レンダラーの作成
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // 照明の追加
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // 地面（道）の作成
            const groundGeo = new THREE.PlaneGeometry(GAME_WIDTH, 200);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
            ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // グリッド（スピード感を出すための模様）
            const gridHelper = new THREE.GridHelper(200, 100, 0x00ff00, 0x00ff00);
            gridHelper.position.y = 0.01;
            scene.add(gridHelper);

            // プレイヤー（ボール）の作成
            const ballGeo = new THREE.SphereGeometry(0.5, 32, 32);
            const ballMat = new THREE.MeshStandardMaterial({ color: 0xff3333 });
            ball = new THREE.Mesh(ballGeo, ballMat);
            ball.position.y = 0.5;
            ball.castShadow = true;
            scene.add(ball);

            // リサイズイベント
            window.addEventListener('resize', onWindowResize, false);
            
            // キーボード操作
            window.addEventListener('keydown', onKeyDown);
            window.addEventListener('keyup', onKeyUp);
            
            // タッチ/マウス操作（画面の左右をタップ・クリックで移動）
            window.addEventListener('pointerdown', onPointerDown);
            window.addEventListener('pointerup', onPointerUp);
        }

        // 障害物の生成
        function spawnObstacle() {
            if (!isPlaying) return;

            const size = 1 + Math.random();
            const obsGeo = new THREE.BoxGeometry(size, size, size);
            const obsMat = new THREE.MeshStandardMaterial({ color: 0x3399ff });
            const obstacle = new THREE.Mesh(obsGeo, obsMat);
            
            // ランダムなX座標に配置
            const halfWidth = GAME_WIDTH / 2 - size / 2;
            obstacle.position.x = (Math.random() * GAME_WIDTH) - (GAME_WIDTH / 2);
            obstacle.position.y = size / 2;
            obstacle.position.z = -50; // 奥から迫ってくる
            
            obstacle.castShadow = true;
            obstacle.receiveShadow = true;

            scene.add(obstacle);
            obstacles.push(obstacle);

            // 徐々に生成間隔を短くする（難易度上昇）
            let spawnRate = Math.max(500, 1500 - (score * 20));
            setTimeout(spawnObstacle, spawnRate);
        }

        // 入力制御
        function onKeyDown(e) {
            if (e.key === 'ArrowLeft' || e.key === 'a') ballSpeedX = -0.15;
            if (e.key === 'ArrowRight' || e.key === 'd') ballSpeedX = 0.15;
        }
        function onKeyUp(e) {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'ArrowRight' || e.key === 'd') ballSpeedX = 0;
        }
        function onPointerDown(e) {
            if (!isPlaying) return;
            if (e.clientX < window.innerWidth / 2) ballSpeedX = -0.15; // 左半分タップ
            else ballSpeedX = 0.15; // 右半分タップ
        }
        function onPointerUp(e) {
            ballSpeedX = 0;
        }

        // リサイズ対応
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ゲームのメインループ
        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying) {
                // ボールの左右移動
                ball.position.x += ballSpeedX;
                
                // ボールが転がるアニメーション
                ball.rotation.x -= speed;
                ball.rotation.z -= ballSpeedX * 2;

                // 道からはみ出ないように制限
                const limit = GAME_WIDTH / 2 - 0.5;
                if (ball.position.x > limit) ball.position.x = limit;
                if (ball.position.x < -limit) ball.position.x = -limit;

                // 障害物の移動と衝突判定
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.position.z += speed; // プレイヤーに向かってくる

                    // 衝突判定 (簡易的なAABBによる距離判定)
                    const distX = Math.abs(ball.position.x - obs.position.x);
                    const distZ = Math.abs(ball.position.z - obs.position.z);
                    const size = obs.geometry.parameters.width / 2;

                    // ボール半径(0.5)と障害物サイズ(size)が重なったらゲームオーバー
                    if (distX < size + 0.4 && distZ < size + 0.4) {
                        gameOver();
                    }

                    // カメラの後ろに通り過ぎたら削除
                    if (obs.position.z > 10) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                        score += 10;
                        scoreEl.innerText = score;
                        speed += 0.002; // 少しずつスピードアップ
                    }
                }
            }

            renderer.render(scene, camera);
        }

        // ゲーム開始
        function startGame() {
            // 初期化
            obstacles.forEach(obs => scene.remove(obs));
            obstacles = [];
            score = 0;
            speed = 0.4;
            scoreEl.innerText = score;
            ball.position.set(0, 0.5, 0);
            
            uiLayer.style.display = 'none';
            isPlaying = true;
            
            spawnObstacle();
        }

        // ゲームオーバー
        function gameOver() {
            isPlaying = false;
            uiLayer.style.display = 'flex';
            messageEl.innerText = "GAME OVER";
            startButton.innerText = "もう一度プレイ";
        }

        startButton.addEventListener('click', startGame);

        // 実行開始
        init();
        animate();
    </script>
</body>
</html>
