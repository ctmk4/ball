<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>擬似3Dボールころころ</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB; /* 空の色 */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
        }
        canvas {
            background-color: #00cccc; /* 床の色 */
            border: 4px solid #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            cursor: none; /* マウスカーソルを消す */
        }
        #ui {
            position: absolute;
            text-align: center;
            pointer-events: none;
        }
        #scoreBoard {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="480" height="360"></canvas>
    
    <div id="scoreBoard">SCORE: <span id="score">0</span></div>
    
    <div id="ui">
        <h1 id="message">擬似3D ボールころころ</h1>
        <p>画面クリックでスタート</p>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const ui = document.getElementById('ui');
    const messageEl = document.getElementById('message');
    const scoreEl = document.getElementById('score');

    // ゲームの状態
    let isPlaying = false;
    let score = 0;
    let frameCount = 0;
    let gameSpeed = 5;

    // プレイヤー（ボール）
    const ball = {
        x: canvas.width / 2,
        y: canvas.height - 60,
        radius: 20,
        color: '#ff4500' // オレンジ色
    };

    // 障害物
    const obstacles = [];
    let obstacleTimer = 0;

    // 遠近法の計算
    const perspective = {
        horizonY: 120, // 地平線の高さ
        vanishingPointX: canvas.width / 2 // 消失点
    };

    // 初期化
    function init() {
        // マウス移動でボールを操作
        canvas.addEventListener('mousemove', (e) => {
            if (!isPlaying) return;
            const rect = canvas.getBoundingClientRect();
            ball.x = e.clientX - rect.left;
            
            // 画面端の制限
            if (ball.x < ball.radius) ball.x = ball.radius;
            if (ball.x > canvas.width - ball.radius) ball.x = canvas.width - ball.radius;
        });

        // クリックでスタート
        canvas.addEventListener('click', startGame);
    }

    // 床のグリッドを描画（これで遠近感を出す）
    function drawGrid() {
        ctx.strokeStyle = '#00aaaa';
        ctx.lineWidth = 1;

        // 縦線（消失点に向かう線）
        const numVerticalLines = 9;
        for (let i = 0; i <= numVerticalLines; i++) {
            const xOnBottom = (canvas.width / numVerticalLines) * i;
            ctx.beginPath();
            ctx.moveTo(perspective.vanishingPointX, perspective.horizonY);
            ctx.lineTo(xOnBottom, canvas.height);
            ctx.stroke();
        }

        // 横線（地平線から手前に向かう線）
        const numHorizontalLines = 8;
        for (let i = 0; i < numHorizontalLines; i++) {
            // スピードに合わせて線を移動させ、ループさせる
            let y = perspective.horizonY + ((i * 30 + (frameCount * gameSpeed)) % (canvas.height - perspective.horizonY));
            if (y > canvas.height) y = perspective.horizonY;

            // 線の太さを手前ほど太くする
            ctx.lineWidth = (y - perspective.horizonY) / 40;

            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvas.width, y);
            ctx.stroke();
        }
    }

    // プレイヤーのボールを描画
    function drawBall() {
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = ball.color;
        ctx.fill();
        ctx.closePath();
    }

    // 障害物の生成と描画
    function updateObstacles() {
        obstacleTimer++;
        
        // 一定フレームごとに新しい障害物を追加
        const spawnRate = Math.max(15, 60 - Math.floor(score / 5)); // スコアが上がると生成速度アップ
        if (obstacleTimer > spawnRate) {
            const size = Math.random() * 40 + 20; // ランダムな幅
            obstacles.push({
                x: Math.random() * (canvas.width - size),
                y: perspective.horizonY, // 地平線から出現
                w: size,
                h: 10,
                speed: gameSpeed,
                z: 0 // 奥行き
            });
            obstacleTimer = 0;
        }

        // 障害物の移動と描画
        for (let i = obstacles.length - 1; i >= 0; i--) {
            const obs = obstacles[i];
            obs.z += 0.02; // 手前に進むにつれてz値を増やす
            
            // 遠近法による座標とサイズの計算
            const scale = 1 + obs.z;
            const drawY = perspective.horizonY + (obs.z * 100);
            const drawW = obs.w * scale;
            const drawH = obs.h * scale;
            
            // 消失点からの相対的な位置
            const relX = obs.x - perspective.vanishingPointX;
            const drawX = perspective.vanishingPointX + (relX * scale);

            // 描画
            ctx.fillStyle = '#ff0000'; // 赤い壁
            ctx.fillRect(drawX, drawY, drawW, drawH);

            // 衝突判定
            if (
                ball.x > drawX && 
                ball.x < drawX + drawW &&
                ball.y > drawY &&
                ball.y < drawY + drawH
            ) {
                gameOver();
            }

            // 画面外に出たら削除
            if (drawY > canvas.height) {
                obstacles.splice(i, 1);
                score++;
                scoreEl.innerText = score;
                gameSpeed += 0.1; // 徐々にスピードアップ
            }
        }
    }

    // ゲームオーバー
    function gameOver() {
        isPlaying = false;
        ui.style.display = 'block';
        messageEl.innerText = "GAME OVER";
    }

    // ゲーム開始
    function startGame() {
        if (isPlaying) return;
        obstacles.length = 0; // 配列をクリア
        score = 0;
        scoreEl.innerText = score;
        gameSpeed = 5;
        ball.x = canvas.width / 2;
        
        ui.style.display = 'none';
        isPlaying = true;
    }

    // メインのゲームループ
    function gameLoop() {
        // 画面をクリア
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        frameCount++;

        // 描画
        drawGrid(); // 床のグリッド
        drawBall(); // プレイヤー
        
        if (isPlaying) {
            updateObstacles(); // 障害物の更新と描画
        }

        requestAnimationFrame(gameLoop);
    }

    // 実行開始
    init();
    gameLoop();

</script>
</body>
</html>
