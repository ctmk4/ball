<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>レトロ風 ローリングスカイ</title>
    <style>
        body {
            margin: 0;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Impact', 'Arial Black', sans-serif;
        }
        canvas {
            /* スクリーンショットと同じような水色の背景 */
            background-color: #66ffff; 
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
            cursor: none;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="640" height="480"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // カメラと3D設定
    const camera = { x: 0, y: 150, z: 0 }; 
    const focalLength = 250; // 遠近感の強さ
    const horizonY = 100; // 地平線のY座標

    // ゲーム状態
    let isPlaying = false;
    let speed = 10;
    let score = 0;
    let distanceOffset = 0; // グリッドを動かすためのオフセット

    // プレイヤー（ボール）
    const ball = {
        x: 0, // 3D空間のX座標
        size: 45,
        color: '#ff6600',
        highlight: '#ffb380'
    };

    // 障害物
    let obstacles = [];
    let spawnTimer = 0;

    // マウス操作（ボールの移動）
    canvas.addEventListener('mousemove', (e) => {
        if (!isPlaying) return;
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        // マウスのX座標を3D空間のX座標に変換（画面中央が0）
        ball.x = (mouseX - canvas.width / 2) * 1.5;
    });

    // クリックでスタート
    canvas.addEventListener('click', () => {
        if (!isPlaying) {
            isPlaying = true;
            obstacles = [];
            score = 0;
            speed = 8;
        }
    });

    // 3D座標を2D画面座標に変換する関数
    function project(x, y, z) {
        const scale = focalLength / (z + focalLength);
        const screenX = (canvas.width / 2) + (x - camera.x) * scale;
        const screenY = horizonY + (y - camera.y) * scale;
        return { x: screenX, y: screenY, scale: scale };
    }

    // 床のグリッドを描画
    function drawGrid() {
        ctx.strokeStyle = '#00cccc';
        ctx.lineWidth = 3;

        // 縦線（奥に向かって伸びる線）
        for (let i = -4; i <= 4; i++) {
            const worldX = i * 200;
            const pStart = project(worldX, 0, 2000); // 遠く
            const pEnd = project(worldX, 0, 0);      // 手前

            ctx.beginPath();
            ctx.moveTo(pStart.x, pStart.y);
            ctx.lineTo(pEnd.x, pEnd.y);
            ctx.stroke();
        }

        // 横線（手前に向かってくる線）
        distanceOffset -= speed;
        if (distanceOffset < 0) distanceOffset += 200;

        for (let i = 0; i < 15; i++) {
            const worldZ = i * 200 + distanceOffset;
            const pLeft = project(-1000, 0, worldZ);
            const pRight = project(1000, 0, worldZ);

            ctx.lineWidth = 1 + (15 - i) * 0.3; // 手前ほど線を太くする
            ctx.beginPath();
            ctx.moveTo(pLeft.x, pLeft.y);
            ctx.lineTo(pRight.x, pRight.y);
            ctx.stroke();
        }
    }

    // 障害物の更新と描画
    function updateAndDrawObstacles() {
        spawnTimer++;
        if (spawnTimer > 40 - Math.min(score / 5, 20)) {
            // ランダムな位置（レーン）に障害物を生成
            const lane = Math.floor(Math.random() * 3) - 1; // -1, 0, 1
            obstacles.push({
                x: lane * 250,
                y: 0,
                z: 2000, // 奥から出現
                width: 150,
                height: 50
            });
            spawnTimer = 0;
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.z -= speed; // 手前に迫ってくる

            // 描画
            const pTopLeft = project(obs.x - obs.width/2, obs.y + obs.height, obs.z);
            const pBottomRight = project(obs.x + obs.width/2, obs.y, obs.z);
            const drawW = pBottomRight.x - pTopLeft.x;
            const drawH = pBottomRight.y - pTopLeft.y;

            ctx.fillStyle = '#ff007f'; // ピンク色
            ctx.fillRect(pTopLeft.x, pTopLeft.y, drawW, drawH);
            ctx.strokeStyle = '#cc0066';
            ctx.lineWidth = 2;
            ctx.strokeRect(pTopLeft.x, pTopLeft.y, drawW, drawH);

            // 衝突判定（Z軸がボールに近く、X座標が重なっているか）
            if (obs.z > 50 && obs.z < 150) {
                if (Math.abs(ball.x - obs.x) < (obs.width / 2 + ball.size)) {
                    isPlaying = false; // ゲームオーバー
                }
            }

            // 画面外（カメラの後ろ）に行ったら消去してスコアアップ
            if (obs.z < 0) {
                obstacles.splice(i, 1);
                score++;
                speed += 0.05; // 少しずつ加速
            }
        }
    }

    // ボールの描画
    function drawBall() {
        // ボールの2D画面上での位置（常に手前）
        const p = project(ball.x, 0, 100);
        
        // 疑似3Dのグラデーション
        const gradient = ctx.createRadialGradient(
            p.x - 10, p.y - 40, 5, 
            p.x, p.y - 25, ball.size
        );
        gradient.addColorStop(0, ball.highlight);
        gradient.addColorStop(1, ball.color);

        ctx.beginPath();
        // ボールが少し浮いているようにY座標を調整
        ctx.arc(p.x, p.y - 25, ball.size, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();
        ctx.closePath();
    }

    // メインループ
    function gameLoop() {
        // 画面のクリア（水色の背景）
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        drawGrid();

        if (isPlaying) {
            updateAndDrawObstacles();
            drawBall();
            
            // スコア表示
            ctx.fillStyle = 'black';
            ctx.font = '24px Arial';
            ctx.fillText("SCORE: " + score, 20, 40);
        } else {
            drawBall();
            // スタート画面の文字（スクショ風の赤い文字）
            ctx.fillStyle = '#ff0000';
            ctx.font = 'bold 50px Impact, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText("CLICK TO START", canvas.width / 2, canvas.height / 2);
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.strokeText("CLICK TO START", canvas.width / 2, canvas.height / 2);
            ctx.textAlign = 'left';
        }

        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>
</body>
</html>
